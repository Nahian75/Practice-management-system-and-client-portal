name: practice-management

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PMS_OWNER_PASSWORD: ${PMS_OWNER_PASSWORD:?Set PMS_OWNER_PASSWORD in .env}
      PMS_APP_PASSWORD: ${PMS_APP_PASSWORD:?Set PMS_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--dbname=pms"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # Development only: catches every email the app sends. Nothing leaves the
  # machine. Read the mail at http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    restart: unless-stopped
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      # High enough that tests never lose an email they are about to read.
      MP_MAX_MESSAGES: "20000"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    security_opt:
      - no-new-privileges:true

  # Encrypted document storage, S3-compatible (docs/documents.md). Requires the
  # access key: anonymous requests are refused. One bucket per database.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-bucket=pms-documents,pms-documents-test,pms-documents-e2e"]
    environment:
      AWS_ACCESS_KEY_ID: ${DOCUMENTS_S3_ACCESS_KEY:?Set DOCUMENTS_S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${DOCUMENTS_S3_SECRET_KEY:?Set DOCUMENTS_S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
    security_opt:
      - no-new-privileges:true

  # Scans every upload before it is stored. It downloads its virus definitions
  # on first start, which takes a few minutes, and keeps them up to date.
  clamav:
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  seaweedfs-data:
  clamav-data:

name: Integrated application checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Scan repository history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner
      - run: npm ci
      - name: Generate disposable test configuration
        run: npm run setup:local
      - name: Validate requirements and source safeguards
        run: |
          npm run check:features
          npm run check:hidden-characters
          npm run check:production-hygiene
          npm run check:dependency-age
          npm run check:security-source
      - name: Check types and build both applications
        run: |
          npm run typecheck -w @practice/api
          npm run typecheck -w @practice/web
          npm run build -w @practice/api
          npm run build -w @practice/web
      - name: Start private test dependencies
        run: docker compose up -d --wait --wait-timeout 900
      - name: Run API, database and authorization tests
        run: npm test -w @practice/api -- --maxWorkers=4
      - name: Run hosting, recovery and scaling regression tests
        run: node --test scripts/*.test.mjs
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Prepare isolated browser database
        run: node e2e/prepare-database.mjs
        working-directory: apps/web
      - name: Run joined browser acceptance
        run: npx playwright test --workers=2
        working-directory: apps/web
      # Never upload traces, configuration or database contents as CI artifacts.
      - name: Stop test dependencies
        if: always()
        run: docker compose down

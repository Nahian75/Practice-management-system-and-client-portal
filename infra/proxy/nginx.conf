# Stass Practice Management System — Production Edge Reverse Proxy
# Enforces Review F2, W1, W3, D2 specifications:
# 1. Routes /api/ directly to NestJS (127.0.0.1:3001) without Next.js middleware buffering
# 2. Strict body size limits: 52 MB on streaming multipart upload routes, 1 MB on all others
# 3. Connection limits (20 concurrent per IP) and sign-in brute force rate limiting
# 4. Preserves Host header for Origin cross-site checks and forwards client IP in X-Forwarded-For

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate limiting & connection limiting zones (Review F2)
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=general_api_rate:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sign_in_rate:10m rate=5r/m;

    upstream api_backend {
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream web_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Redirect plain HTTP to TLS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Primary TLS Server
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # Production TLS certificates (mount from host/certbot/vault)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Hardened TLS parameters: TLS 1.2 and 1.3 only
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Global connection limit per client IP
        limit_conn conn_limit_per_ip 20;

        # Common proxy headers passed to upstream services
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";

        # ---------------------------------------------------------------------
        # 1. Document & File Multipart Uploads (52 MB Limit, Streaming Proxy)
        # ---------------------------------------------------------------------
        # Routes:
        # - Matter documents: POST /api/matters/{id}/documents
        # - Document versions: POST /api/documents/{id}/versions
        # - Client CDD evidence: POST /api/clients/{id}/cdd/{id}/evidence
        # - Compliance suspicion reports: POST /api/compliance/restricted-reports
        # - HR personnel files: POST /api/hr/people/{id}/files
        location ~ ^/api/(matters/[^/]+/documents|documents/[^/]+/versions|clients/[^/]+/cdd/[^/]+/evidence|compliance/restricted-reports|hr/people/[^/]+/files)$ {
            client_max_body_size 52m;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            limit_req zone=general_api_rate burst=10 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api_backend;
        }

        # ---------------------------------------------------------------------
        # 2. Authentication Sign-In Endpoint (Brute-Force & Timing Protection)
        # ---------------------------------------------------------------------
        location /api/auth/sign-in {
            client_max_body_size 64k;
            limit_req zone=sign_in_rate burst=5 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api_backend;
        }

        # ---------------------------------------------------------------------
        # 3. All Other API Endpoints (Strict 1 MB Body Limit)
        # ---------------------------------------------------------------------
        location /api/ {
            client_max_body_size 1m;
            limit_req zone=general_api_rate burst=30 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api_backend;
        }

        # ---------------------------------------------------------------------
        # 4. Web Application Frontend (Next.js SSR & Static Assets)
        # ---------------------------------------------------------------------
        location / {
            client_max_body_size 1m;
            proxy_pass http://web_backend;
        }
    }
}
